<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1210" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ma Caisse : ventes, dépenses, stock et gain réel pour les petits commerces.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Caisse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Ma Caisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Concept : carnet de caisse d'un commerçant. Bilan présenté comme un ticket de caisse (lignes, puis total), navigation à cinq onglets en bas, une colonne étroite faite pour le téléphone. */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --surface2:#F5F7F6; --paper:#FFFEFA;
  --fg:#10201B; --muted:#586861; --line:#D8DFDB;
  --accent:#0B57D0; --accent-fg:#FFFFFF; --accent-soft:#E2ECFC;
  --gain:#0C7A4A; --gain-soft:#DCF2E6; --loss:#B42318; --loss-soft:#FBE3E0;
  --warn:#9A5206; --warn-soft:#FBEBD2; --bar:#C5D4F2; --scrim:rgba(8,14,12,.5);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1210; --surface:#151D1A; --surface2:#1B2622; --paper:#18221E;
  --fg:#E8F0EC; --muted:#93A59D; --line:#293631;
  --accent:#7BA9FF; --accent-fg:#08142E; --accent-soft:#16294D;
  --gain:#52D193; --gain-soft:#103528; --loss:#FF8E7E; --loss-soft:#3B1914;
  --warn:#F3B462; --warn-soft:#3A2A10; --bar:#2B4272; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#151D1A; --surface2:#1B2622; --paper:#18221E;
  --fg:#E8F0EC; --muted:#93A59D; --line:#293631;
  --accent:#7BA9FF; --accent-fg:#08142E; --accent-soft:#16294D;
  --gain:#52D193; --gain-soft:#103528; --loss:#FF8E7E; --loss-soft:#3B1914;
  --warn:#F3B462; --warn-soft:#3A2A10; --bar:#2B4272; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:560px;margin-inline:auto;padding-block:14px 170px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.namebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);padding:3px 10px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px;text-transform:capitalize}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sync{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;padding-top:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gain)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="local"] i{background:var(--muted)}
.sync[data-s="err"] i{background:var(--loss)}
h2.sec{margin:6px 0 -4px;font-family:var(--display);font-size:17px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.notice{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.notice b{color:var(--warn)}
.muted{color:var(--muted)}
.note{margin:8px 2px 0;font-size:12.5px;color:var(--muted)}

/* Ticket de caisse */
.receipt{position:relative;background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:16px 16px 14px;margin-bottom:10px}
.receipt::after{content:"";position:absolute;left:-1px;right:-1px;top:calc(100% - 1px);height:9px;
  background:linear-gradient(135deg,var(--paper) 4.5px,transparent 0) 0 0/12px 9px,linear-gradient(225deg,var(--paper) 4.5px,transparent 0) 0 0/12px 9px}
.r-head{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:10px;border-bottom:2px dashed var(--line)}
.r-head b{color:var(--fg);font-weight:600}
.r-lines{margin:0;padding:10px 0;display:flex;flex-direction:column;gap:6px;border-bottom:2px dashed var(--line)}
.r-lines>div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.r-lines dt{font-size:14px;min-width:0}
.r-lines dd{margin:0;font-family:var(--mono);font-weight:500;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.r-lines .soft dt,.r-lines .soft dd{color:var(--muted)}
.r-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;flex-wrap:wrap}
.r-total span{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.r-total strong{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.r-total.gain strong,.r-total.gain span{color:var(--gain)}
.r-total.loss strong,.r-total.loss span{color:var(--loss)}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.big{flex:1 1 150px;min-height:50px;font-size:15.5px}
.btn.small{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--loss)}
.cta{display:flex;gap:10px;flex-wrap:wrap}

/* Listes */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list .main{min-width:0;flex:1}
.list .main b{display:block;font-weight:600;overflow-wrap:anywhere}
.list .main span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-family:var(--mono);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--gain-soft);color:var(--gain)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--loss-soft);color:var(--loss)}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{font-family:var(--display);font-size:18px}
.empty p{margin:0;color:var(--muted);max-width:34ch}

/* Vente */
.search input{width:100%}
input[type=text],input[type=search],input[type=date],input:not([type]),input[inputmode]{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 5px}
label.check{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
small{color:var(--muted);font-size:12.5px;display:block;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;min-height:92px;min-width:0}
.tile .t-name{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.tile .t-price{font-family:var(--mono);font-size:13.5px;font-weight:500}
.tile .t-stock{font-size:12px;color:var(--muted);margin-top:auto}
.tile .t-stock.low{color:var(--warn);font-weight:700}
.tile .t-stock.out{color:var(--loss);font-weight:700}
.tile[aria-disabled="true"]{opacity:.55}
.tile.in{border-color:var(--accent);background:var(--accent-soft)}
.t-qty{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 6px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.qty span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cartbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:12;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.cartbar>div{max-width:560px;margin-inline:auto;display:flex;gap:10px;align-items:center}
.cartbar .sum{flex:1;min-width:0;line-height:1.2}
.cartbar .sum span{font-size:12.5px;color:var(--muted);display:block}
.cartbar .sum b{font-family:var(--display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

/* Formulaires */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1 1 130px}
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px;font-family:var(--display);font-size:21px;font-weight:800}
.panel p{margin:2px 0 0;color:var(--muted)}

/* Stock */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.prow{display:flex;flex-direction:column;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prow .head b{overflow-wrap:anywhere}
.prow .sub{font-size:13px;color:var(--muted)}
.prow .acts{display:flex;gap:8px;flex-wrap:wrap}
.stk{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.stk small{margin:2px 0 0;text-align:right}

/* Rapports */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .lbl{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:16px;text-transform:capitalize;min-width:0}
.nav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700}
.nav button:disabled{opacity:.35}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis .stat{padding:10px}
.kpis .stat b{font-size:17px}
.top-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.top-list li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center}
.rank{font-family:var(--mono);font-weight:600;color:var(--muted);text-align:center}
.tp b{display:block;font-weight:600;overflow-wrap:anywhere}
.tp .bar{height:7px;border-radius:4px;background:var(--surface2);margin-top:5px;overflow:hidden}
.tp .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tp .bar.ex i{background:var(--warn)}
.top-list .r{text-align:right;line-height:1.25}
.top-list .r small{margin:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:9px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0;padding:0 2px}
.tabs button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.lbl{font-weight:600;font-size:13.5px;margin:12px 0 7px}
.top-list.nr li{grid-template-columns:minmax(0,1fr) auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}}

.notice.info{background:var(--accent-soft);border-color:var(--accent)}
.notice.info b{color:var(--accent)}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap}
.sep{border:0;border-top:1px solid var(--line);margin:18px 0 4px}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand">
      <h1><span id="shopName">Ma boutique</span><button class="namebtn" data-act="settings" type="button">Modifier</button></h1>
      <p id="dateLine"></p>
    </div>
    <div class="side"><div class="sync" id="sync" data-s="local" aria-live="polite"><i></i><span>Chargement…</span></div><button class="namebtn" id="curBtn" data-act="cur" type="button" aria-label="Changer de devise">Devise : FC</button></div>
  </header>
  <main id="view"><div class="card empty"><b>Chargement de votre caisse…</b></div></main>
</div>

<div id="cartbar" class="cartbar" hidden></div>

<nav class="tabs" aria-label="Navigation principale"><div>
  <button type="button" data-act="tab" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button type="button" data-act="tab" data-t="sell"><svg viewBox="0 0 24 24"><path d="M5 9h14l-1.5 10.5h-11z"/><path d="M9 9V6.5a3 3 0 0 1 6 0V9"/></svg>Vendre</button>
  <button type="button" data-act="tab" data-t="exp"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3z"/><path d="M3 7l3-3h12l3 3"/><path d="M16 13h2"/></svg>Dépenses</button>
  <button type="button" data-act="tab" data-t="stock"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>Stock</button>
  <button type="button" data-act="tab" data-t="rep"><svg viewBox="0 0 24 24"><path d="M5 20v-8"/><path d="M11 20V5"/><path d="M17 20v-5"/><path d="M3 20.5h18"/></svg>Rapports</button>
</div></nav>

<div id="sheet" class="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
var STANDALONE=!(window.claude&&window.claude.use);
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,"0")};
var ymd=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var today=function(){return ymd(new Date())};
var parse=function(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
var mkey=function(s){return s.slice(0,7)};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
var addMonths=function(k,n){var a=k.split("-").map(Number);var d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
var longDate=function(s){return parse(s).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
var shortDate=function(s){return parse(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})};
var monthName=function(k){return parse(k+"-01").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})};
var nf=new Intl.NumberFormat("fr-FR");
var fmt=function(n){return nf.format(Math.round(n)).replace(/[  ]/g," ").replace("-","−")};
var CUR="FC",RATE=2800;
var nfU=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
var fc=function(n){
  if(CUR==="USD")return nfU.format(n/RATE).replace(/[\u202f\u00a0]/g,"\u00a0").replace("-","\u2212")+"\u00a0$";
  return fmt(n)+"\u00a0FC";
};
var curName=function(){return CUR==="USD"?"USD":"FC"};
function toBase(v){var n=num(v);return CUR==="USD"?Math.round(n*RATE):n}
function toDisp(n){
  if(n===""||n==null)return "";
  return CUR==="USD"?String(Math.round(n/RATE*100)/100).replace(".",","):String(n);
}
function applyCur(){
  CUR=(S.shop&&S.shop.cur)==="USD"?"USD":"FC";
  RATE=(S.shop&&S.shop.rate>0)?S.shop.rate:2800;
}
var num=function(v){var n=Number(String(v==null?"":v).replace(/[\s  ]/g,"").replace(",","."));return isFinite(n)?n:0};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var timeOf=function(ts){return new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};

/* ---------- Enregistrement : base de données de la page + copie sur l'appareil ---------- */
var LSP="macaisse.v1.";
function lsGet(k){try{var v=localStorage.getItem(LSP+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LSP+k,JSON.stringify(v))}catch(e){}}
var DB=null,UID=null;
var path=function(k){return "data/users/"+UID+"/"+k};
function setSync(s){
  var el=$("#sync");if(!el)return;
  var t={ok:"Enregistré",saving:"Enregistrement…",local:"Sur cet appareil",err:"Non synchronisé"};
  el.setAttribute("data-s",s);el.lastChild.textContent=t[s]||"";
}
async function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    var u=await window.claude.use("user");
    if(u&&u.id){UID=await u.id()}
    if(UID){DB=await window.claude.use("db")}
  }catch(e){DB=null}
}
async function loadKey(k){
  if(DB){try{var s=await DB.doc(path(k)).get();if(s.exists)return JSON.parse(JSON.stringify(s.data()))}catch(e){}}
  return lsGet(k);
}
var timers={},pending={},busy={};
function save(k,v){
  lsSet(k,v);
  if(!DB){setSync("local");return}
  pending[k]=v;setSync("saving");clearTimeout(timers[k]);
  timers[k]=setTimeout(function(){flush(k)},400);
}
async function flush(k){
  if(busy[k]){timers[k]=setTimeout(function(){flush(k)},300);return}
  var v=pending[k];if(!v)return;
  delete pending[k];busy[k]=true;
  try{
    await DB.doc(path(k)).set(JSON.parse(JSON.stringify(v)));
    if(!Object.keys(pending).length)setSync("ok");
  }catch(e){setSync("err")}
  busy[k]=false;
  if(pending[k])flush(k);
}

/* ---------- Données ---------- */
var S={shop:null,months:{}};
var tab="home",cart={},Q="",repMode="day",repDay=today(),repMonth=mkey(today()),expDate=today(),expCat="Transport",armed=null;
var CATS=["Transport","Loyer","Électricité","Salaire","Repas","Autre"];
var saveShop=function(){save("shop",S.shop)};
var saveMonth=function(k){save("m-"+k,S.months[k])};
async function ensureMonth(k){
  if(S.months[k])return S.months[k];
  var d=await loadKey("m-"+k);
  if(!S.months[k]){
    d=d||{};d.sales=d.sales||[];d.expenses=d.expenses||[];
    S.months[k]=d;
  }
  return S.months[k];
}
var getM=function(k){return S.months[k]||null};
var dayLines=function(d){var m=getM(mkey(d));return m?m.sales.filter(function(l){return l.d===d}):[]};
var dayExp=function(d){var m=getM(mkey(d));return m?m.expenses.filter(function(e){return e.d===d}):[]};
function agg(lines,exps){
  var sales=0,cogs=0,qty=0,byP={},sids={},n=0,ex=0,byC={};
  lines.forEach(function(l){
    var r=l.qty*l.price,c=l.qty*l.cost;
    sales+=r;cogs+=c;qty+=l.qty;
    if(!sids[l.sid]){sids[l.sid]=1;n++}
    var key=l.pid||l.name;
    var p=byP[key]||(byP[key]={name:l.name,qty:0,rev:0,gain:0});
    p.qty+=l.qty;p.rev+=r;p.gain+=r-c;
  });
  exps.forEach(function(e){ex+=e.amount;byC[e.cat]=(byC[e.cat]||0)+e.amount});
  var top=Object.keys(byP).map(function(k){return byP[k]}).sort(function(a,b){return b.qty-a.qty||b.rev-a.rev});
  var cats=Object.keys(byC).map(function(k){return {name:k,amt:byC[k]}}).sort(function(a,b){return b.amt-a.amt});
  return {sales:sales,cogs:cogs,gross:sales-cogs,ex:ex,net:sales-cogs-ex,n:n,qty:qty,top:top,cats:cats};
}
function groupSales(lines){
  var g={};
  lines.forEach(function(l){
    var x=g[l.sid]||(g[l.sid]={sid:l.sid,ts:l.ts,lines:[],total:0});
    x.lines.push(l);x.total+=l.qty*l.price;
  });
  return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return b.ts-a.ts});
}

/* ---------- Données d'exemple ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function seedDemo(){
  var P=function(name,price,cost,track,stock,min){return {id:uid(),name:name,price:price,cost:cost,track:track,stock:stock,min:min,x:1}};
  var prods=[P("Sucre 1 kg",4500,3600,true,24,6),P("Huile de palme 1 L",6000,5000,true,12,4),P("Savon de toilette",1500,1100,true,40,10),P("Biscuits",500,350,true,0,15),P("Eau minérale 0,5 L",1000,650,true,4,12),P("Coupe homme",5000,0,false,0,0),P("Appel cabine 5 min",500,0,false,0,0)];
  var weights=[3,2,4,6,5,1,6],wsum=27;
  S.shop={name:"Ma boutique",demo:true,products:prods};
  var now=Date.now();
  for(var i=13;i>=0;i--){
    var d=addDays(today(),-i),mk=mkey(d),r=rng(1000+i*37);
    var m=S.months[mk]||(S.months[mk]={sales:[],expenses:[]});
    var start=parse(d).getTime()+7.5*3600000;
    var span=i===0?Math.max(1800000,Math.min(now-start,11*3600000)):11*3600000;
    var ns=i===0?6+Math.floor(r()*4):14+Math.floor(r()*10);
    for(var s=0;s<ns;s++){
      var sid=uid(),ts=Math.min(start+r()*span,now-60000),nl=1+Math.floor(r()*3);
      for(var j=0;j<nl;j++){
        var x=r()*wsum,idx=0,acc=0;
        for(var q=0;q<weights.length;q++){acc+=weights[q];if(x<acc){idx=q;break}}
        var p=prods[idx],qty=(idx===5)?1:1+Math.floor(r()*(idx<5?3:2));
        m.sales.push({id:uid(),sid:sid,ts:ts,d:d,pid:p.id,name:p.name,qty:qty,price:p.price,cost:p.cost,x:1});
      }
    }
    m.expenses.push({id:uid(),ts:start,d:d,cat:"Transport",note:"",amount:2000+Math.floor(r()*3)*1000,x:1});
    if(i%3===0)m.expenses.push({id:uid(),ts:start,d:d,cat:"Repas",note:"",amount:2500,x:1});
    if(i===9||i===3)m.expenses.push({id:uid(),ts:start,d:d,cat:"Électricité",note:"Recharge compteur",amount:15000,x:1});
    if(i===6)m.expenses.push({id:uid(),ts:start,d:d,cat:"Salaire",note:"Aide de la semaine",amount:20000,x:1});
  }
  S.shop.demoMonths=Object.keys(S.months);
  saveShop();Object.keys(S.months).forEach(saveMonth);
}

/* ---------- Composants ---------- */
function toast(msg){
  var t=$("#toast");t.textContent=msg;t.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2800);
}
function emptyState(title,text,label,act){
  return '<div class="card empty"><b>'+esc(title)+'</b><p>'+esc(text)+'</p>'+(label?'<button class="btn primary" type="button" data-act="'+act+'">'+esc(label)+'</button>':'')+'</div>';
}
function receipt(a,title,sub){
  var loss=a.net<0,pct=a.sales>0?Math.round(a.gross/a.sales*100):0;
  return `<section class="receipt" aria-label="Bilan">
  <div class="r-head"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
  <dl class="r-lines">
    <div><dt>Ventes</dt><dd>${fc(a.sales)}</dd></div>
    <div><dt>− Marchandises vendues</dt><dd>${fc(a.cogs)}</dd></div>
    <div class="soft"><dt>Marge sur les ventes${a.sales?" ("+pct+" %)":""}</dt><dd>${fc(a.gross)}</dd></div>
    <div><dt>− Dépenses</dt><dd>${fc(a.ex)}</dd></div>
  </dl>
  <div class="r-total ${loss?"loss":"gain"}"><span>${loss?"Perte réelle":"Gain réel"}</span><strong>${fc(a.net)}</strong></div>
</section>`;
}
function stockInfo(p){
  if(!p.track)return {sev:3,cls:"",pill:"",label:"Sans stock"};
  if(p.stock<=0)return {sev:0,cls:"out",pill:"out",label:"Rupture"};
  if(p.stock<=p.min)return {sev:1,cls:"low",pill:"low",label:"Stock bas"};
  return {sev:2,cls:"",pill:"ok",label:"En stock"};
}
function topList(arr){
  var mx=Math.max.apply(null,arr.map(function(p){return p.qty}).concat(1));
  return '<ol class="top-list">'+arr.map(function(p,i){
    return `<li><span class="rank">${i+1}</span><div class="tp"><b>${esc(p.name)}</b><div class="bar"><i style="width:${Math.max(4,Math.round(p.qty/mx*100))}%"></i></div></div><div class="r"><span class="amt">×${fmt(p.qty)}</span><small>${fc(p.rev)}</small></div></li>`;
  }).join("")+'</ol>';
}
function saleRow(g,cancel){
  var items=g.lines.map(function(l){return l.qty+"× "+l.name}).join(", ");
  var on=armed===g.sid;
  var btn=cancel?`<button class="btn small${on?" danger":""}" type="button" data-act="cancel-sale" data-id="${g.sid}">${on?"Confirmer":"Annuler"}</button>`:"";
  return `<li><div class="main"><b>${esc(items)}</b><span>${timeOf(g.ts)}</span></div><div class="rcol"><span class="amt">${fc(g.total)}</span>${btn}</div></li>`;
}

function vHome(){
  var d=today(),a=agg(dayLines(d),dayExp(d)),m=getM(mkey(d))||{sales:[],expenses:[]},ma=agg(m.sales,m.expenses),h="";
  h+=installCard()+backupCard();

  var low=S.shop.products.filter(function(p){return p.track&&p.stock<=p.min}).sort(function(x,y){return x.stock-y.stock});

    }).join("")+`</ul><button class="link" type="button" data-act="tab" data-t="stock">Voir tout le stock</button></div>`;
  }

function vSell(){
  if(!S.shop.products.length)return emptyState("Aucun produit enregistré","Ajoutez vos produits ou vos services avec leur prix pour enregistrer des ventes.","Ajouter un produit","new-product");
  return `<div id="cart"></div><div class="search"><label class="sr" for="q">Chercher un produit</label><input id="q" type="search" placeholder="Chercher un produit" autocomplete="off" value="${esc(Q)}"></div><div id="grid" class="grid"></div><h2 class="sec">Ventes d’aujourd’hui</h2><div class="card" id="today"></div>`;
}
function cartLines(){
  return Object.keys(cart).map(function(id){
    var p=S.shop.products.find(function(x){return x.id===id});
    return p?{p:p,q:cart[id]}:null;
  }).filter(Boolean);
}
function cartTotal(){return cartLines().reduce(function(s,x){return s+x.p.price*x.q},0)}
function renderCart(){
  var el=$("#cart");if(!el)return;
  var ls=cartLines();
  if(!ls.length){el.innerHTML="";return}
  el.innerHTML=`<div class="card"><ul class="list">`+ls.map(function(x){
    return `<li><div class="main"><b>${esc(x.p.name)}</b><span>${fc(x.p.price)} l’unité</span></div><div class="qty"><button type="button" data-act="dec" data-id="${x.p.id}" aria-label="Retirer une unité : ${esc(x.p.name)}">−</button><span>${x.q}</span><button type="button" data-act="inc" data-id="${x.p.id}" aria-label="Ajouter une unité : ${esc(x.p.name)}">+</button></div><span class="amt">${fc(x.p.price*x.q)}</span></li>`;
  }).join("")+`</ul></div>`;
}
function renderGrid(){
  var el=$("#grid");if(!el)return;
  var q=Q.trim().toLowerCase();
  var ps=S.shop.products.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)>=0});
  if(!ps.length){el.innerHTML=`<p class="muted" style="grid-column:1/-1;margin:4px 0">Aucun produit ne correspond à « ${esc(Q)} ».</p>`;return}
  el.innerHTML=ps.map(function(p){
    var si=stockInfo(p),n=cart[p.id]||0,out=p.track&&p.stock<=0;
    var lbl=p.track?(p.stock<=0?"Rupture":"Reste "+p.stock):"Sans stock";
    return `<button type="button" class="tile${n?" in":""}" data-act="add" data-id="${p.id}"${out?' aria-disabled="true"':""}><span class="t-name">${esc(p.name)}</span><span class="t-price">${fc(p.price)}</span><span class="t-stock ${si.cls}">${lbl}</span>${n?`<span class="t-qty">${n}</span>`:""}</button>`;
  }).join("");
}
function renderToday(){
  var el=$("#today");if(!el)return;
  var g=groupSales(dayLines(today()));
  el.innerHTML=g.length?`<ul class="list">`+g.map(function(x){return saleRow(x,true)}).join("")+`</ul>`:`<p class="muted" style="margin:0">Aucune vente enregistrée aujourd’hui.</p>`;
}
function renderCartBar(){
  var el=$("#cartbar"),ls=cartLines();
  if(tab!=="sell"||!ls.length){el.hidden=true;return}
  var n=ls.reduce(function(s,x){return s+x.q},0);
  el.hidden=false;
  el.innerHTML=`<div><div class="sum"><span>${n} article${n>1?"s":""}</span><b>${fc(cartTotal())}</b></div><button class="btn" type="button" data-act="clear-cart">Vider</button><button class="btn primary" type="button" data-act="checkout">Encaisser</button></div>`;
}
function addToCart(id){
  var p=S.shop.products.find(function(x){return x.id===id});if(!p)return;
  var n=cart[id]||0;
  if(p.track&&n+1>p.stock){toast(p.stock<=0?p.name+" : rupture de stock":"Stock insuffisant : il en reste "+p.stock);return}
  cart[id]=n+1;renderCart();renderGrid();renderCartBar();
}
function decCart(id){
  if(!cart[id])return;
  cart[id]--;if(cart[id]<=0)delete cart[id];
  renderCart();renderGrid();renderCartBar();
}
async function checkout(){
  var ls=cartLines();if(!ls.length)return;
  var d=today(),mk=mkey(d),m=await ensureMonth(mk),sid=uid(),ts=Date.now(),total=0;
  ls.forEach(function(x){
    m.sales.push({id:uid(),sid:sid,ts:ts,d:d,pid:x.p.id,name:x.p.name,qty:x.q,price:x.p.price,cost:x.p.cost});
    if(x.p.track)x.p.stock=Math.max(0,x.p.stock-x.q);
    total+=x.p.price*x.q;
  });
  cart={};saveMonth(mk);saveShop();
  toast("Vente enregistrée : "+fc(total));
  render();
}
async function cancelSale(sid){
  var mk=mkey(today()),m=await ensureMonth(mk);
  m.sales.filter(function(l){return l.sid===sid}).forEach(function(l){
    var p=S.shop.products.find(function(x){return x.id===l.pid});
    if(p&&p.track)p.stock+=l.qty;
  });
  m.sales=m.sales.filter(function(l){return l.sid!==sid});
  saveMonth(mk);saveShop();toast("Vente annulée");render();
}

/* ---------- Rapports ---------- */
function niceCeil(v){
  if(v<=0)return 1;
  var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p,steps=[1,1.5,2,3,4,5,6,8,10];
  for(var i=0;i<steps.length;i++){if(f<=steps[i]+1e-9)return steps[i]*p}
  return 10*p;
}
function kfmt(v){var a=Math.abs(v),g=v<0?"\u2212":"";if(a>=1000)return g+nf.format(a/1000)+" k";if(a<100&&a%1)return g+nf.format(Math.round(a*10)/10);return g+nf.format(Math.round(a))}
function dailyRows(mk){
  var m=getM(mk),a=mk.split("-").map(Number),nd=new Date(a[0],a[1],0).getDate(),rows=[];
  for(var i=1;i<=nd;i++){
    var d=mk+"-"+pad(i);
    var x=agg(m.sales.filter(function(l){return l.d===d}),m.expenses.filter(function(e){return e.d===d}));
    rows.push({i:i,d:d,s:x.sales,n:x.net,has:x.n>0||x.ex>0});
  }
  return rows;
}
function chart(rows){
  var f=CUR==="USD"?RATE:1;
  rows=rows.map(function(r){return {i:r.i,d:r.d,s:r.s/f,n:r.n/f,has:r.has}});
  var W=340,H=170,L=40,R=6,T=10,B=22,pw=W-L-R,ph=H-T-B;
  var maxS=Math.max.apply(null,rows.map(function(r){return r.s}).concat(1));
  var minN=Math.min.apply(null,rows.map(function(r){return r.n}).concat(0));
  var top=niceCeil(maxS),lo=minN<0?-niceCeil(-minN):0;
  var y=function(v){return T+ph*(1-(v-lo)/(top-lo))};
  var band=pw/rows.length;
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ventes et gain réel pour chaque jour du mois">';
  var ticks=[top,top/2,0];if(lo<0)ticks.push(lo);
  ticks.forEach(function(t){
    svg+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text x="'+(L-4)+'" y="'+(y(t)+3).toFixed(1)+'" text-anchor="end">'+kfmt(t)+'</text>';
  });
  rows.forEach(function(r){
    var x0=L+(r.i-1)*band;
    if(r.s>0){svg+='<rect x="'+(x0+band*.15).toFixed(1)+'" y="'+y(r.s).toFixed(1)+'" width="'+(band*.7).toFixed(1)+'" height="'+Math.max(0,y(0)-y(r.s)).toFixed(1)+'" style="fill:var(--bar)"/>'}
    if(r.has){
      var yn=y(r.n),y0=y(0);
      svg+='<rect x="'+(x0+band*.3).toFixed(1)+'" y="'+Math.min(yn,y0).toFixed(1)+'" width="'+(band*.4).toFixed(1)+'" height="'+Math.max(1,Math.abs(yn-y0)).toFixed(1)+'" style="fill:'+(r.n<0?"var(--loss)":"var(--gain)")+'"/>';
    }
    if(r.i===1||r.i%5===0){svg+='<text x="'+(x0+band/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+r.i+'</text>'}
  });
  return svg+'</svg><div class="legend"><span><i style="background:var(--bar)"></i>Ventes</span><span><i style="background:var(--gain)"></i>Gain réel</span></div>';
}
function vRep(){
  var isDay=repMode==="day",mk=isDay?mkey(repDay):repMonth;
  var atEnd=isDay?repDay>=today():repMonth>=mkey(today());
  var h=`<div class="seg" role="group" aria-label="Période"><button type="button" data-act="rep-mode" data-m="day" aria-pressed="${isDay}">Jour</button><button type="button" data-act="rep-mode" data-m="month" aria-pressed="${!isDay}">Mois</button></div>`;
  h+=`<div class="nav"><button type="button" data-act="rep-prev" aria-label="Période précédente">‹</button><div class="lbl">${isDay?longDate(repDay):monthName(repMonth)}</div><button type="button" data-act="rep-next" aria-label="Période suivante"${atEnd?" disabled":""}>›</button></div>`;
  if(isDay)h+=`<div><label class="sr" for="rp-date">Choisir une date</label><input id="rp-date" type="date" value="${repDay}" max="${today()}"></div>`;
  var m=getM(mk);
  if(!m){
    ensureMonth(mk).then(function(){if(tab==="rep")render()});
    return h+`<div class="card empty"><b>Chargement…</b></div>`;
  }
  var lines=isDay?m.sales.filter(function(l){return l.d===repDay}):m.sales;
  var exps=isDay?m.expenses.filter(function(e){return e.d===repDay}):m.expenses;
  var a=agg(lines,exps);
  h+=receipt(a,isDay?"Bilan du jour":"Bilan du mois",isDay?shortDate(repDay):monthName(repMonth));
  if(!a.n&&!a.ex)h+=`<p class="muted" style="margin:0">Aucune vente ni dépense sur cette période.</p>`;
  h+=`<div class="kpis"><div class="stat"><span>Ventes</span><b>${a.n}</b></div><div class="stat"><span>Panier moyen</span><b>${a.n?fc(a.sales/a.n):"—"}</b></div><div class="stat"><span>Articles vendus</span><b>${fmt(a.qty)}</b></div></div>`;
  if(!isDay){
    var rows=dailyRows(mk),best=null;
    rows.forEach(function(r){if(r.has&&(!best||r.n>best.n))best=r});
    h+=`<h2 class="sec">Jour par jour</h2><div class="card">`+chart(rows)+(best&&a.n?`<p class="note">Meilleur jour : ${shortDate(best.d)}, gain réel ${fc(best.n)}.</p>`:"")+`</div>`;
  }
  if(a.top.length)h+=`<h2 class="sec">Produits les plus vendus</h2><div class="card">`+topList(a.top.slice(0,8))+`</div>`;
  if(a.cats.length){
    var mx=a.cats[0].amt;
    h+=`<h2 class="sec">Où part l’argent</h2><div class="card"><ul class="top-list nr">`+a.cats.map(function(c){
      return `<li><div class="tp"><b>${esc(c.name)}</b><div class="bar ex"><i style="width:${Math.max(4,Math.round(c.amt/mx*100))}%"></i></div></div><div class="r"><span class="amt">${fc(c.amt)}</span><small>${Math.round(c.amt/a.ex*100)} %</small></div></li>`;
    }).join("")+`</ul></div>`;
  }
  return h;
}

function openSheet(html){
  $("#panel").innerHTML=html;$("#sheet").hidden=false;
  setTimeout(function(){var i=$("#panel input[type=text],#panel input[inputmode]");if(i)i.focus()},60);

function closeSheet(){$("#sheet").hidden=true;$("#panel").innerHTML="";armed=null}
function arm(key,fn,redraw){
  if(armed===key){armed=null;fn();return}
  armed=key;redraw();
  setTimeout(function(){if(armed===key){armed=null;redraw()}},4000);
}
function findP(id){return S.shop.products.find(function(x){return x.id===id})}
function render(){
  applyCur();

  });

  $("#view").innerHTML=views[tab]();
  if(tab==="sell"&&S.shop.products.length){renderCart();renderGrid();renderToday()}

document.addEventListener("click",function(e){
  if(e.target.id==="sheet"){closeSheet();return}
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),id=t.getAttribute("data-id");
  if(a==="tab"){tab=t.getAttribute("data-t");window.scrollTo(0,0);render()}
  else if(a==="add"||a==="inc")addToCart(id);
  else if(a==="dec")decCart(id);
  else if(a==="clear-cart"){cart={};renderCart();renderGrid();renderCartBar()}
  else if(a==="checkout")checkout();
  else if(a==="cancel-sale")arm(id,function(){cancelSale(id)},renderToday);
  else if(a==="del-exp")arm(id,function(){delExpense(id)},renderExpList);
  else if(a==="exp-cat"){
    expCat=t.getAttribute("data-c");
    document.querySelectorAll("#ex-cats .chip").forEach(function(c){c.setAttribute("aria-pressed",String(c===t))});
  }
  else if(a==="new-product")openSheet(productForm());
  else if(a==="edit-product"){var p=findP(id);if(p)openSheet(productForm(p))}
  else if(a==="restock"){var q=findP(id);if(q)openSheet(restockForm(q))}
  else if(a==="del-product"){
    var key="dp"+id;
    arm(key,function(){delProduct(id)},function(){t.textContent=armed===key?"Confirmer la suppression":"Supprimer ce produit"});
  }
  else if(a==="settings")openSheet(settingsHtml());
  else if(a==="cur"){
    S.shop.cur=CUR==="USD"?"FC":"USD";saveShop();render();
    toast(S.shop.cur==="USD"?"Montants en dollars. Taux : 1 $ = "+fmt(RATE)+" FC (à régler dans Modifier)":"Montants en francs congolais");
  }
  else if(a==="set-cur"){
    S.shop.cur=t.getAttribute("data-c");saveShop();render();
    document.querySelectorAll("#cur-chips .chip").forEach(function(c){c.setAttribute("aria-pressed",String(c===t))});
  }
  else if(a==="clear-demo")clearDemo();
  else if(a==="export")exportData();
  else if(a==="import")$("#imp-file").click();
  else if(a==="import-confirm")applyImport();
  else if(a==="install")doInstall();
  else if(a==="hide-install"){lsSet("hideinstall",1);render()}
  else if(a==="close")closeSheet();
  else if(a==="rep-mode"){
    var mode=t.getAttribute("data-m");
    if(mode!==repMode){
      if(mode==="month")repMonth=mkey(repDay);
      else if(mkey(repDay)!==repMonth)repDay=repMonth===mkey(today())?today():repMonth+"-01";
      repMode=mode;render();
    }
  }
  else if(a==="rep-prev"){if(repMode==="day")repDay=addDays(repDay,-1);else repMonth=addMonths(repMonth,-1);render()}
  else if(a==="rep-next"){
    if(repMode==="day"){if(repDay<today())repDay=addDays(repDay,1)}
    else if(repMonth<mkey(today()))repMonth=addMonths(repMonth,1);
    render();
  }
});

/* ---------- Version autonome : installation, sauvegarde, hors ligne ---------- */
var deferredInstall=null,pendingImport=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();deferredInstall=e;
  if(S.shop&&tab==="home"&&$("#sheet").hidden)render();
});
window.addEventListener("appinstalled",function(){deferredInstall=null;if(S.shop&&tab==="home")render()});
function isInstalled(){
  try{return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true}catch(e){return false}
}
function installCard(){
  if(!STANDALONE||isInstalled()||lsGet("hideinstall"))return "";
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredInstall)return `<div class="notice info"><span><b>Installer Ma Caisse</b> sur ce téléphone pour l’ouvrir comme une application, même sans internet.</span><div class="rowbtn"><button class="btn small primary" type="button" data-act="install">Installer</button><button class="btn small" type="button" data-act="hide-install">Plus tard</button></div></div>`;
  if(ios)return `<div class="notice info"><span><b>Installer Ma Caisse</b> : dans Safari, touchez le bouton Partager, puis « Sur l’écran d’accueil ».</span><div class="rowbtn"><button class="btn small" type="button" data-act="hide-install">Compris</button></div></div>`;
  return "";
}
function doInstall(){
  if(!deferredInstall)return;
  var ev=deferredInstall;deferredInstall=null;
  ev.prompt();
  if(ev.userChoice)ev.userChoice.then(function(){render()});
}
function backupCard(){
  if(!STANDALONE||S.shop.demo)return "";
  var last=lsGet("lastbackup")||lsGet("firstuse")||Date.now();
  if(Date.now()-last<7*86400000)return "";
  return `<div class="notice info"><span><b>Pensez à sauvegarder.</b> Vos données sont sur ce téléphone. Gardez-en une copie pour ne rien perdre.</span><div class="rowbtn"><button class="btn small primary" type="button" data-act="export">Sauvegarder maintenant</button></div></div>`;
}
function exportData(){
  var out={app:"ma-caisse",v:1,exported:new Date().toISOString(),shop:S.shop,months:{}};
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(LSP+"m-")===0)out.months[k.slice(LSP.length+2)]=JSON.parse(localStorage.getItem(k));
    }
  }catch(e){}
  Object.keys(S.months).forEach(function(k){out.months[k]=S.months[k]});
  var blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="ma-caisse-sauvegarde-"+today()+".json";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
  lsSet("lastbackup",Date.now());
  toast("Sauvegarde téléchargée : cherchez le fichier dans vos téléchargements");
  if(tab==="home"&&$("#sheet").hidden)render();
}
function readImport(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(String(r.result));
      if(!d||d.app!=="ma-caisse"||!d.shop||!Array.isArray(d.shop.products))throw new Error("format");
      var ks=Object.keys(d.months||{}),nb=0;
      ks.forEach(function(k){var m=d.months[k];if(m&&Array.isArray(m.sales)){var seen={};m.sales.forEach(function(l){if(!seen[l.sid]){seen[l.sid]=1;nb++}})}});
      pendingImport=d;
      openSheet(`<h2>Restaurer cette sauvegarde ?</h2><p>${d.shop.products.length} produit${d.shop.products.length>1?"s":""}, ${nb} vente${nb>1?"s":""} sur ${ks.length} mois${d.exported?". Faite le "+esc(new Date(d.exported).toLocaleDateString("fr-FR")):""}.</p><p><b>Vos données actuelles seront remplacées.</b></p><div class="actions"><button class="btn danger" type="button" data-act="import-confirm">Remplacer mes données</button><button class="btn" type="button" data-act="close">Annuler</button></div>`);
    }catch(e){toast("Ce fichier n’est pas une sauvegarde de Ma Caisse")}
  };
  r.onerror=function(){toast("Impossible de lire ce fichier")};
  r.readAsText(file);
}
function applyImport(){
  var d=pendingImport;if(!d)return;
  pendingImport=null;
  try{
    var rm=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(LSP+"m-")===0)rm.push(k)}
    rm.forEach(function(k){localStorage.removeItem(k)});
  }catch(e){}
  S.months={};
  Object.keys(d.months||{}).forEach(function(k){
    if(!/^\d{4}-\d{2}$/.test(k))return;
    var m=d.months[k]||{};
    m.sales=Array.isArray(m.sales)?m.sales:[];m.expenses=Array.isArray(m.expenses)?m.expenses:[];
    S.months[k]=m;lsSet("m-"+k,m);
  });
  S.shop=d.shop;lsSet("shop",S.shop);
  cart={};closeSheet();
  ensureMonth(mkey(today())).then(function(){toast("Sauvegarde restaurée");render()});
}
function standaloneInit(){
  if(!STANDALONE)return;
  if(!lsGet("firstuse"))lsSet("firstuse",Date.now());
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
  if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
  }
}

async function boot(){
  standaloneInit();
  try{
    await Promise.race([connect(),new Promise(function(r){setTimeout(r,4000)})]);
    setSync(DB?"ok":"local");
    var shop=await loadKey("shop");
    if(shop&&shop.products)S.shop=shop;else await seedDemo();
    await ensureMonth(mkey(today()));
    render();
  }catch(err){
    $("#view").innerHTML=emptyState("Impossible d’ouvrir la caisse","Rechargez la page. Si le problème continue, vos données restent sur cet appareil.","","");
  }
}
boot();
})();
</script>
